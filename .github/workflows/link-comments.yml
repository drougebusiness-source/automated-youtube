name: Link comments

# Every 3 hours: under each Short that has gone public, posts a comment linking to the full video.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: link-comments
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post link comments
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m ytauto comments
      - name: Save progress
        if: always()
        run: |
          git config user.name "daily-videos-bot"
          git config user.email "daily-videos-bot@users.noreply.github.com"
          git add state/comments.json 2>/dev/null || exit 0
          git commit -m "Link comments $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
