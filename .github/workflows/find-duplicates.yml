name: Find duplicate uploads

# Read only: lists scheduled videos that share a title and publish time (left by a crashed
# batch run). Nothing is deleted; the owner decides.
on:
  workflow_dispatch:

jobs:
  dupes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: List duplicates
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m ytauto dupes | tee -a "$GITHUB_STEP_SUMMARY"
