name: Schedule videos

# Gives every uploaded batch video its publish date and time from the batch plan.
# Run it from the Actions tab whenever new batch videos have been uploaded.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-videos
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Schedule uploaded videos
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m ytauto schedule
      - name: Save which videos are scheduled
        if: always()
        run: |
          git config user.name "daily-videos-bot"
          git config user.email "daily-videos-bot@users.noreply.github.com"
          git add state/batch.json
          git commit -m "Scheduled videos $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
