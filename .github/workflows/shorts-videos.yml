name: Shorts

# Makes 4 Shorts a day (7 AM POV, 12 PM painting story, 4 PM musical moment, 9 PM sleep), each
# linked to one of that day's long videos, uploads them and schedules them. If YouTube's upload
# limit stops it, it continues by itself the next morning.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD)"
        required: true
      days:
        description: "How many days of Shorts"
        default: "7"
  schedule:
    - cron: "23 11 * * *"   # daily: continue an unfinished Shorts run, or start the next 7 days when under 10 are queued

permissions:
  contents: write

concurrency:
  group: batch-videos
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Is there a Shorts run to make or continue?
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "{\"start\": \"${{ inputs.start }}\", \"days\": ${{ inputs.days }}}" > state/shorts_request.json
          fi
          # Keep the queue full by itself: when fewer than 10 days of Shorts are planned, the
          # daily run asks for the next 7 days. Days whose long videos aren't made yet wait for them.
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f state/shorts_request.json ]; then
            python3 - <<'PY'
          import json
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("America/New_York")).date()
          items = json.load(open("state/shorts.json"))["items"]
          last = max([today] + [date.fromisoformat(i["publish_date"]) for i in items])
          if (last - today).days < 10:
              start = (last + timedelta(days=1)).isoformat()
              json.dump({"start": start, "days": 7}, open("state/shorts_request.json", "w"))
              print(f"Only {(last - today).days} days of Shorts queued: starting 7 more days from {start}")
          else:
              print(f"{(last - today).days} days of Shorts queued: nothing to do")
          PY
          fi
          if [ -f state/shorts_request.json ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and Python packages
        if: steps.plan.outputs.run == 'yes'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Reuse downloaded music and paintings
        if: steps.plan.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            assets/music_cache
            assets/painting_cache
          key: media-${{ hashFiles('assets/music.json', 'assets/paintings.json') }}
      - name: Make, upload and schedule Shorts
        if: steps.plan.outputs.run == 'yes'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          START=$(python3 -c "import json;print(json.load(open('state/shorts_request.json'))['start'])")
          DAYS=$(python3 -c "import json;print(json.load(open('state/shorts_request.json'))['days'])")
          python -m ytauto shorts --start "$START" --days "$DAYS" --stop-at-limit || echo "Some Shorts failed; retried next run."
          # Finished when every Short that's still in the future is uploaded.
          python3 - "$START" "$DAYS" <<'PY' && rm -f state/shorts_request.json || true
          import json, sys
          from datetime import date, timedelta, datetime, timezone
          from zoneinfo import ZoneInfo
          start, days = date.fromisoformat(sys.argv[1]), int(sys.argv[2])
          last = (start + timedelta(days=days - 1)).isoformat()
          items = json.load(open("state/shorts.json"))["items"]
          missing = [i for i in items if not i.get("video_id")]
          today = datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          print(f"{sum(1 for i in items if i.get('video_id'))} uploaded, {len(missing)} waiting")
          # Days whose long videos aren't uploaded yet have no Shorts planned: keep going daily.
          have = {i["publish_date"] for i in items}
          unplanned = [d for d in ((start + timedelta(days=k)).isoformat() for k in range(days))
                       if d >= today and d not in have]
          if unplanned:
              print("waiting for long videos on", ", ".join(unplanned))
          sys.exit(0 if (not missing and not unplanned) or today > last else 3)
          PY
      - name: Save progress
        if: always() && steps.plan.outputs.run == 'yes'
        run: |
          git config user.name "daily-videos-bot"
          git config user.email "daily-videos-bot@users.noreply.github.com"
          git add -A state/
          git commit -m "Shorts progress $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
