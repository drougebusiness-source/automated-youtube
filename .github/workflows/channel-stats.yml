name: Channel stats

# Prints views, likes and comments for every video the bot uploaded, grouped by theme,
# length and time of day. The full table is attached to the run as stats.csv.
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Channel report
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m ytauto stats
      - uses: actions/upload-artifact@v4
        with:
          name: channel-stats-${{ github.run_id }}
          path: output/stats.csv
          retention-days: 90
